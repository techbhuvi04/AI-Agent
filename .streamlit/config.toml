# Monochrome Financial Dashboard Theme (Dark)
# Strictly black / white / gray — no hue anywhere, distinctions made by
# brightness and weight instead of color.

[theme]
base = "dark"
primaryColor = "#FFFFFF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#141414"
codeBackgroundColor = "#141414"
textColor = "#F5F5F5"
linkColor = "#FFFFFF"
borderColor = "#3A3A3A"
codeTextColor = "#D4D4D4"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

# Typography - Clean, professional fonts
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors — all grayscale. Urgency/positivity read through
# brightness (white = most attention) rather than hue.
greenColor = "#E5E5E5"   # Positive/gains
redColor = "#FFFFFF"     # Negative/losses/alerts — brightest, draws the eye
yellowColor = "#A3A3A3"  # Warnings/caution
orangeColor = "#C7C7C7"  # Alerts
blueColor = "#D4D4D4"    # Informational
violetColor = "#B5B5B5"  # Accent/highlights
grayColor = "#737373"    # Neutral/secondary text

# Chart colors - grayscale ramp, still mutually distinguishable
chartCategoricalColors = [
    "#FFFFFF",
    "#D4D4D4",
    "#A3A3A3",
    "#8A8A8A",
    "#737373",
    "#525252",
    "#404040",
    "#F5F5F5",
]

# Sequential colors for heatmaps (black -> white)
chartSequentialColors = [
    "#000000",
    "#171717",
    "#262626",
    "#404040",
    "#525252",
    "#737373",
    "#A3A3A3",
    "#D4D4D4",
    "#E5E5E5",
    "#FFFFFF",
]

# Dataframe styling
dataframeBorderColor = "#3A3A3A"
dataframeHeaderBackgroundColor = "#141414"

# Sidebar
[theme.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#141414"
codeBackgroundColor = "#141414"
textColor = "#F5F5F5"
borderColor = "#3A3A3A"
primaryColor = "#FFFFFF"
